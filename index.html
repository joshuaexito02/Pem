<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<body>
    <div class="container">
        </style>
        <img src="c1ee112e-a83b-4820-a520-a2bcb559232a.jpeg" alt="Left Image">
        <img src="6c6c0f9e-2653-46a9-86e3-0cd779559819.jpeg" alt="Right Image">
        <style>
            .container{
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-radius: 25px;
            }
             img{
                width: 300px;
                height: 363px;
                border-radius: 25px;
            }
        </style>
    </div>

    <div>
        <a href="INDEX.html">
            <button>Pindota Ni Ya!!</button>
        </a>
    </div>
    <style>
        a{
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
        }
        button {
            display: flex;
            background-color: purple;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 50px;

        }

        button:hover {
            background-color: darkmagenta;
        }

        div{
            width: 100%;
            height: 100vh;
        }
    </style>
